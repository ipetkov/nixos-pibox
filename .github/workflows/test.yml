name: "Test"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'main'
      - 'ci*' # Allow testing CI fixes without opening a PR

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-pass:
    name: all systems go
    runs-on: ubuntu-latest
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - run: exit 1
    needs:
      - tests
      - zizmor

  tests:
    name: run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          extra-platforms = aarch64-linux
    - name: install QEMU/binfmt
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt:latest
        platforms: "arm64"
    - name: check formatting
      run: nix fmt -- --ci
    - name: check for dead code
      run: nix develop .# --command deadnix .
    - name: flake checks
      run: nix flake check --keep-going --print-build-logs
    - name: build packages
      run: nix build --keep-going --print-build-logs -f ./ci/packages.nix --argstr system aarch64-linux

  zizmor:
    name: run zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
    - name: Run zizmor 🌈
      run: nix develop .#zizmor --command zizmor --persona=auditor --format=sarif . >results.sarif 
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: results.sarif
        category: zizmor
